<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="HuntAI"/>
<meta name="theme-color" content="#000000"/>
<title>HuntAI — Bug Bounty Intelligence</title>
<style>
/* System fonts - work everywhere, no internet needed */
</style>
<style>
:root{
  --bg:#050505;--s1:#0d0d0d;--s2:#141414;--s3:#1c1c1c;
  --border:#222;--border2:#2a2a2a;
  --text:#f0f0f0;--muted:#555;--muted2:#888;
  --green:#00ff88;--red:#ff3d3d;--yellow:#ffcc00;--blue:#00aaff;--purple:#a855f7;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,'SF Pro Text','Segoe UI',sans-serif;overflow:hidden;}
body{display:flex;flex-direction:column;height:100dvh;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}

/* TOPBAR */
#topbar{
display:flex;align-items:center;justify-content:space-between;
padding:calc(14px + var(–safe-top)) 16px 12px;
background:var(–s1);border-bottom:1px solid var(–border);flex-shrink:0;
}
.logo{font-family:-apple-system,‘SF Pro Display’,‘Segoe UI’,sans-serif;font-size:22px;font-weight:800;letter-spacing:-0.5px;}
.logo span{color:var(–green);}
.logo-sub{font-family:‘Courier New’,monospace;font-size:9px;color:var(–muted);letter-spacing:.15em;}
.sys-badge{font-family:‘Courier New’,monospace;font-size:9px;padding:3px 8px;border-radius:4px;border:1px solid var(–green)33;background:var(–green)0d;color:var(–green);}

/* NAV */
#nav{display:flex;background:var(–s1);border-bottom:1px solid var(–border);flex-shrink:0;}
.nav-tab{
flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
padding:8px 4px;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;
}
.nav-tab.active{border-bottom-color:var(–green);}
.nav-tab.active .nt-label{color:var(–green);}
.nt-icon{font-size:16px;}
.nt-label{font-size:9px;font-weight:600;color:var(–muted);letter-spacing:.05em;text-transform:uppercase;}

/* MAIN */
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}

/* BUTTONS */
.btn{border:none;border-radius:10px;cursor:pointer;font-family:-apple-system,‘SF Pro Display’,‘Segoe UI’,sans-serif;font-weight:700;letter-spacing:.05em;transition:all .2s;display:flex;align-items:center;gap:6px;justify-content:center;}
.btn:active{transform:scale(.96);}
.btn-green{background:var(–green);color:#000;padding:12px 18px;font-size:13px;width:100%;}
.btn-outline{background:transparent;border:1px solid var(–border2);color:var(–muted2);padding:8px 14px;font-size:12px;}
.btn-red{background:var(–red)18;border:1px solid var(–red)44;color:var(–red);padding:8px 14px;font-size:12px;}
.btn-blue{background:var(–blue)18;border:1px solid var(–blue)44;color:var(–blue);padding:8px 14px;font-size:12px;}

/* INPUTS */
.input{width:100%;background:var(–s2);border:1px solid var(–border2);border-radius:10px;padding:11px 14px;color:var(–text);font-family:-apple-system,‘SF Pro Text’,‘Segoe UI’,sans-serif;font-size:14px;outline:none;transition:border-color .2s;}
.input:focus{border-color:var(–green)66;}
.input::placeholder{color:var(–muted);}
.label{font-size:11px;color:var(–muted2);font-weight:500;margin-bottom:6px;letter-spacing:.05em;text-transform:uppercase;}
.field{margin-bottom:14px;}
textarea.input{resize:none;min-height:80px;line-height:1.5;}

/* SEVERITY */
.sev{font-family:‘Courier New’,monospace;font-size:9px;padding:2px 7px;border-radius:4px;border:1px solid;font-weight:700;}
.sev-critical{color:#ff00aa;border-color:#ff00aa44;background:#ff00aa11;}
.sev-high{color:var(–red);border-color:var(–red)44;background:var(–red)11;}
.sev-medium{color:var(–yellow);border-color:var(–yellow)44;background:var(–yellow)11;}
.sev-low{color:var(–green);border-color:var(–green)44;background:var(–green)11;}
.sev-info{color:var(–blue);border-color:var(–blue)44;background:var(–blue)11;}

/* CARDS */
.card{background:var(–s1);border:1px solid var(–border);border-radius:14px;margin-bottom:10px;overflow:hidden;}
.card-header{padding:12px 14px;border-bottom:1px solid var(–border);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-family:-apple-system,‘SF Pro Display’,‘Segoe UI’,sans-serif;font-size:14px;font-weight:700;}
.card-body{padding:14px;}

/* MODE CARDS */
.mode-card{
background:var(–s2);border:1px solid var(–border);border-radius:14px;
padding:18px;margin-bottom:10px;cursor:pointer;transition:all .2s;
animation:fadeIn .3s ease;
}
.mode-card:active{transform:scale(.98);}
.mode-card.hunter{border-color:var(–red)44;}
.mode-card.spectate{border-color:var(–purple)44;}
.mode-card.learn{border-color:var(–blue)44;}
.mode-icon{font-size:28px;margin-bottom:8px;}
.mode-title{font-family:-apple-system,‘SF Pro Display’,‘Segoe UI’,sans-serif;font-size:16px;font-weight:800;margin-bottom:4px;}
.mode-desc{font-size:12px;color:var(–muted2);line-height:1.5;}
.mode-badge{font-family:‘Courier New’,monospace;font-size:9px;padding:2px 8px;border-radius:4px;margin-top:8px;display:inline-block;}

/* SESSION LIST */
.session-item{
background:var(–s2);border:1px solid var(–border);border-radius:10px;
padding:12px 14px;margin-bottom:8px;cursor:pointer;
display:flex;align-items:center;gap:10px;
}
.session-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.session-title{font-size:13px;font-weight:600;}
.session-meta{font-size:10px;color:var(–muted);font-family:‘Courier New’,monospace;}

/* CHAT */
#chat-wrap{display:flex;flex-direction:column;height:100%;}
#chat-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch;}
.msg-user{align-self:flex-end;background:var(–green);color:#000;border-radius:16px 16px 4px 16px;padding:10px 14px;max-width:86%;font-size:13px;line-height:1.5;font-weight:500;}
.msg-ai{align-self:flex-start;background:var(–s2);border:1px solid var(–border);border-radius:16px 16px 16px 4px;padding:10px 14px;max-width:86%;font-size:13px;line-height:1.65;color:var(–text);}
.msg-ai code{font-family:‘Courier New’,monospace;background:var(–s3);border-radius:4px;padding:1px 5px;font-size:11px;color:var(–green);}
.msg-ai pre{font-family:‘Courier New’,monospace;background:var(–s3);border:1px solid var(–border2);border-radius:8px;padding:10px;font-size:11px;overflow-x:auto;margin:6px 0;color:var(–green);white-space:pre-wrap;}
.ai-tag{font-family:‘Courier New’,monospace;font-size:9px;color:var(–green);margin-bottom:4px;letter-spacing:.1em;}
#chat-input-bar{
padding:8px 12px calc(10px + var(–safe-bot));
border-top:1px solid var(–border);background:var(–s1);flex-shrink:0;
}
#chat-row{display:flex;gap:8px;align-items:flex-end;}
#ci{
flex:1;background:var(–s2);border:1.5px solid var(–border2);
border-radius:12px;padding:10px 13px;color:var(–text);
font-family:-apple-system,‘SF Pro Text’,‘Segoe UI’,sans-serif;font-size:14px;outline:none;
resize:none;min-height:42px;max-height:100px;line-height:1.5;
-webkit-appearance:none;transition:border-color .2s;
}
#ci:focus{border-color:var(–green)66;}
#cs{
width:42px;height:42px;border-radius:12px;border:none;
background:var(–green);color:#000;font-size:16px;cursor:pointer;
display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
#cs:active{transform:scale(.88);}

/* FINDING CARD */
.finding-card{
background:var(–s2);border:1px solid var(–border);border-radius:12px;
padding:14px;margin-bottom:10px;animation:fadeIn .3s ease;
}
.finding-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px;gap:8px;}
.finding-title{font-size:13px;font-weight:600;line-height:1.4;flex:1;}
.finding-url{font-family:‘Courier New’,monospace;font-size:10px;color:var(–muted2);margin-bottom:6px;word-break:break-all;}
.finding-desc{font-size:12px;color:var(–muted2);line-height:1.6;margin-bottom:8px;}
.finding-type{font-family:‘Courier New’,monospace;font-size:9px;color:var(–purple);border:1px solid var(–purple)44;background:var(–purple)11;padding:2px 7px;border-radius:4px;display:inline-block;margin-bottom:8px;}

/* NOTE CARD */
.note-card{
background:var(–s2);border:1px solid var(–border);border-radius:12px;
padding:14px;margin-bottom:10px;
}
.note-title{font-size:13px;font-weight:600;margin-bottom:6px;}
.note-content{font-family:‘Courier New’,monospace;font-size:11px;color:var(–muted2);line-height:1.8;margin-bottom:8px;white-space:pre-wrap;}
.note-tags{display:flex;gap:6px;flex-wrap:wrap;}
.note-tag{font-size:10px;color:var(–muted);background:var(–s3);border-radius:4px;padding:2px 8px;}

/* TARGET CARD */
.target-card{
background:var(–s2);border:1px solid var(–border);border-radius:12px;
padding:14px;margin-bottom:10px;
}
.target-name{font-family:-apple-system,‘SF Pro Display’,‘Segoe UI’,sans-serif;font-size:15px;font-weight:700;margin-bottom:4px;}
.target-url{font-family:‘Courier New’,monospace;font-size:11px;color:var(–blue);margin-bottom:6px;}
.target-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:10px;color:var(–muted);margin-bottom:10px;}
.active-badge{background:var(–green)18;border:1px solid var(–green)44;color:var(–green);font-family:‘Courier New’,monospace;font-size:9px;padding:2px 8px;border-radius:4px;}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px;}
.stat-box{background:var(–s2);border:1px solid var(–border);border-radius:10px;padding:10px 6px;text-align:center;}
.stat-num{font-family:-apple-system,‘SF Pro Display’,‘Segoe UI’,sans-serif;font-size:22px;font-weight:800;}
.stat-label{font-size:9px;color:var(–muted);margin-top:2px;letter-spacing:.03em;}

/* OPS */
.ops-line{font-family:‘Courier New’,monospace;font-size:11px;color:var(–green);line-height:2;padding:14px;}
.ops-cursor{display:inline-block;width:8px;height:14px;background:var(–green);animation:blink .8s step-end infinite;vertical-align:middle;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}

/* ANIMATIONS */
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.dot-anim{display:flex;gap:4px;align-items:center;padding:2px 0;}
.dot-anim span{width:6px;height:6px;border-radius:50%;background:var(–green);animation:dotB 1.1s infinite ease-in-out;}
.dot-anim span:nth-child(2){animation-delay:.18s;}
.dot-anim span:nth-child(3){animation-delay:.36s;}
@keyframes dotB{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1.1);opacity:1}}

.empty{text-align:center;padding:40px 20px;}
.empty-icon{font-size:36px;margin-bottom:10px;}
.empty-text{font-size:12px;color:var(–muted);}
</style>

</head>
<body>

<div id="topbar">
  <div>
    <div class="logo">Hunt<span>AI</span></div>
    <div class="logo-sub">BUG BOUNTY INTELLIGENCE</div>
  </div>
  <div class="sys-badge" id="sys-status">SYSTEM_ONLINE</div>
</div>

<div id="nav">
  <div class="nav-tab active" onclick="switchNav('ops')" id="nt-ops">
    <span class="nt-icon">⚡</span>
    <span class="nt-label">OPS</span>
  </div>
  <div class="nav-tab" onclick="switchNav('sessions')" id="nt-sessions">
    <span class="nt-icon">🤖</span>
    <span class="nt-label">AI</span>
  </div>
  <div class="nav-tab" onclick="switchNav('targets')" id="nt-targets">
    <span class="nt-icon">🎯</span>
    <span class="nt-label">Targets</span>
  </div>
  <div class="nav-tab" onclick="switchNav('findings')" id="nt-findings">
    <span class="nt-icon">🐛</span>
    <span class="nt-label">Findings</span>
  </div>
  <div class="nav-tab" onclick="switchNav('notes')" id="nt-notes">
    <span class="nt-icon">📝</span>
    <span class="nt-label">Notes</span>
  </div>
</div>

<div id="main"></div>

<script>
// ── FREE AI CONFIG (no key needed from user) ──
const MODELS = [
  'https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.2',
  'https://api-inference.huggingface.co/models/HuggingFaceH4/zephyr-7b-beta',
  'https://api-inference.huggingface.co/models/microsoft/DialoGPT-large'
];

// ── STATE ──
let currentNav = 'ops';
let currentMode = null;
let chatHistory = [];
let isLoading = false;
let targets = JSON.parse(localStorage.getItem('huntai2_targets') || '[]');
let findings = JSON.parse(localStorage.getItem('huntai2_findings') || '[]');
let notes = JSON.parse(localStorage.getItem('huntai2_notes') || '[]');
let sessions = JSON.parse(localStorage.getItem('huntai2_sessions') || '[]');

// ── SYSTEM PROMPTS ──
const PROMPTS = {
  hunter: `You are HuntAI in HUNTER mode — an elite bug bounty attack partner. You think like a senior offensive security researcher.

When given a target, you provide:
- Attack surface analysis
- Specific vulnerability types most likely present
- Exact payloads and test steps
- API endpoints to probe
- Tools and commands

Be tactical, precise, aggressive. Give real payloads like:
XSS: <img src=x onerror=alert(document.cookie)>
SQLi: ' OR '1'='1
IDOR: Change /api/v1/user/123 to /api/v1/user/124
SSRF: ?url=http://169.254.169.254/latest/meta-data/

Always rate severity: CRITICAL/HIGH/MEDIUM/LOW`,

  spectate: `You are HuntAI in SPECTATE mode — an elite code vulnerability analyzer.

When given code, configs, HTTP requests/responses, or URLs, you:
1. Find ALL security vulnerabilities immediately
2. Rate each: CRITICAL/HIGH/MEDIUM/LOW
3. Explain exactly why it's vulnerable
4. Provide exact exploit payload/steps
5. Suggest fix

Look for: XSS, SQLi, IDOR, CSRF, SSRF, RCE, Auth bypass, Info disclosure, Insecure deserialization, XXE, Path traversal`,

  learn: `You are HuntAI in LEARN mode — a world-class bug bounty methodology teacher.

You teach real techniques with real examples:
- Actual payloads that work
- Real vulnerability patterns
- Step-by-step methodology
- How to chain bugs for higher severity
- How to write winning reports

Make it practical — every lesson includes something the hunter can use TODAY.`
};

// ── CALL AI (free, no user key) ──
async function callAI(messages, mode) {
  const systemPrompt = PROMPTS[mode] || PROMPTS.hunter;
  
  // Build Mistral instruct format
  let prompt = '<s>[INST] ' + systemPrompt + ' [/INST] Understood. I am HuntAI in ' + mode.toUpperCase() + ' mode. Ready. </s>';
  messages.forEach(function(m) {
    if (m.role === 'user') prompt += '<s>[INST] ' + m.content + ' [/INST]';
    else prompt += ' ' + m.content + ' </s>';
  });

  // Try models in order
  for (let i = 0; i < MODELS.length; i++) {
    try {
      const res = await fetch(MODELS[i], {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          inputs: prompt,
          parameters: {max_new_tokens: 800, temperature: 0.7, return_full_text: false, do_sample: true}
        })
      });
      
      if (res.status === 503) {
        return '⏳ AI model is loading up... Please wait 20 seconds and send your message again!';
      }
      
      if (!res.ok) continue;
      
      const data = await res.json();
      if (data.error) {
        if (data.error.includes('loading')) return '⏳ AI waking up... Resend in 20 seconds!';
        continue;
      }
      
      if (Array.isArray(data) && data[0]?.generated_text) {
        return data[0].generated_text.trim();
      }
    } catch(e) {
      continue;
    }
  }
  
  return '❌ All AI models busy. Try again in 30 seconds.';
}

// ── NAV ──
function switchNav(nav) {
  currentNav = nav;
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('nt-' + nav).classList.add('active');
  render();
}

function render() {
  const main = document.getElementById('main');
  if (currentNav === 'ops') renderOps(main);
  else if (currentNav === 'sessions') renderSessions(main);
  else if (currentNav === 'targets') renderTargets(main);
  else if (currentNav === 'findings') renderFindings(main);
  else if (currentNav === 'notes') renderNotes(main);
}

// ── OPS CENTER ──
function renderOps(c) {
  const critical = findings.filter(f=>f.severity==='critical').length;
  const high = findings.filter(f=>f.severity==='high').length;

  c.innerHTML = `<div style="padding:16px;">
    <div style="font-family:'Courier New',monospace;font-size:10px;color:var(--green);margin-bottom:16px;line-height:2;">
      OPS CENTER<br>
      SYSTEM_ONLINE // WAITING_FOR_INPUT<span class="ops-cursor"></span>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;">
      <div onclick="switchNav('sessions')" style="background:var(--red)11;border:1px solid var(--red)33;border-radius:12px;padding:14px;cursor:pointer;">
        <div style="font-size:20px;margin-bottom:6px;">🎯</div>
        <div style="font-family:-apple-system,'SF Pro Display','Segoe UI',sans-serif;font-size:13px;font-weight:700;color:var(--red);">Hunter Mode</div>
        <div style="font-size:10px;color:var(--muted);margin-top:3px;">Attack partner</div>
      </div>
      <div onclick="switchNav('sessions')" style="background:var(--purple)11;border:1px solid var(--purple)33;border-radius:12px;padding:14px;cursor:pointer;">
        <div style="font-size:20px;margin-bottom:6px;">👁️</div>
        <div style="font-family:-apple-system,'SF Pro Display','Segoe UI',sans-serif;font-size:13px;font-weight:700;color:var(--purple);">Spectate Mode</div>
        <div style="font-size:10px;color:var(--muted);margin-top:3px;">Code analyzer</div>
      </div>
      <div onclick="switchNav('sessions')" style="background:var(--blue)11;border:1px solid var(--blue)33;border-radius:12px;padding:14px;cursor:pointer;">
        <div style="font-size:20px;margin-bottom:6px;">📚</div>
        <div style="font-family:-apple-system,'SF Pro Display','Segoe UI',sans-serif;font-size:13px;font-weight:700;color:var(--blue);">Learn Mode</div>
        <div style="font-size:10px;color:var(--muted);margin-top:3px;">Methodology</div>
      </div>
      <div onclick="switchNav('findings')" style="background:var(--yellow)11;border:1px solid var(--yellow)33;border-radius:12px;padding:14px;cursor:pointer;">
        <div style="font-size:20px;margin-bottom:6px;">🐛</div>
        <div style="font-family:-apple-system,'SF Pro Display','Segoe UI',sans-serif;font-size:13px;font-weight:700;color:var(--yellow);">${findings.length} Findings</div>
        <div style="font-size:10px;color:var(--muted);margin-top:3px;">${critical} critical</div>
      </div>
    </div>

    <div style="font-family:'Courier New',monospace;font-size:10px;color:var(--muted);margin-bottom:8px;letter-spacing:.1em;">RECENT_FINDINGS</div>

    ${findings.length === 0 ?
      '<div class="empty"><div class="empty-icon">🎯</div><div class="empty-text">No findings yet — start hunting!</div></div>' :
      findings.slice(-5).reverse().map(f => `
        <div style="background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;">
          <span class="sev sev-${f.severity}">${f.severity.toUpperCase()}</span>
          <div style="flex:1;">
            <div style="font-size:12px;font-weight:600;">${f.vulnType || 'BUG'}</div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px;">${f.title}</div>
          </div>
        </div>
      `).join('')
    }

    <div style="margin-top:16px;font-family:'Courier New',monospace;font-size:10px;color:var(--muted);line-height:2;">
      Active Targets: <span style="color:var(--green)">${targets.length}</span><br>
      Total Findings: <span style="color:var(--green)">${findings.length}</span><br>
      Critical: <span style="color:var(--red)">${critical}</span><br>
      High: <span style="color:var(--yellow)">${high}</span>
    </div>
  </div>`;
}

// ── AI SESSIONS ──
function renderSessions(c) {
  if (currentMode) {
    renderChat(c);
    return;
  }

  c.innerHTML = `<div style="padding:16px;">
    <div style="font-family:'Courier New',monospace;font-size:10px;color:var(--green);margin-bottom:4px;">AI SESSIONS</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:16px;">Choose a mode and start hunting</div>

    <div class="mode-card hunter" onclick="startSession('hunter')">
      <div class="mode-icon">🎯</div>
      <div class="mode-title" style="color:var(--red);">HUNTER</div>
      <div class="mode-desc">Tactical attack partner — give me a target or ask for attack vectors</div>
      <div class="mode-badge" style="background:var(--red)11;border:1px solid var(--red)33;color:var(--red);">OFFENSIVE MODE</div>
    </div>

    <div class="mode-card spectate" onclick="startSession('spectate')">
      <div class="mode-icon">👁️</div>
      <div class="mode-title" style="color:var(--purple);">SPECTATE</div>
      <div class="mode-desc">Paste code — I'll find every exploitable vulnerability</div>

async function sendMsg() {
const ci = document.getElementById(‘ci’);
const text = ci.value.trim();
if (!text || isLoading) return;
ci.value = ‘’; ci.style.height = ‘auto’;

chatHistory.push({role:‘user’, content:text});
isLoading = true;
appendMsg(`<div class="msg-user">${escHtml(text)}</div>`);
appendMsg(`<div class="msg-ai"><div class="ai-tag">HUNTAI</div><div class="dot-anim"><span></span><span></span><span></span></div></div>`, ‘loading-msg’);
scrollChat();

const reply = await callAI(chatHistory, currentMode);
chatHistory.push({role:‘assistant’, content:reply});

const loadingEl = document.getElementById(‘loading-msg’);
if (loadingEl) loadingEl.outerHTML = `<div class="msg-ai"><div class="ai-tag">HUNTAI</div>${formatAI(reply)}</div>`;

isLoading = false;
scrollChat();
}

msgs.appendChild(div.firstChild || div);
}

// ── UTILS ──
function escHtml(t){return String(t).replace(/&/g,’&’).replace(/</g,’<’).replace(/>/g,’>’).replace(/\n/g,’<br>’);}
function formatAI(text){
let t=text;
t=t.replace(/`[\w]*\n?([\s\S]*?)`/g,’<pre>$1</pre>’);
t=t.replace(/`([^`]+)`/g,’<code>$1</code>’);
t=t.replace(/**(.*?)**/g,’<strong style="color:var(--green)">$1</strong>’);
t=t.replace(/^### (.*)/gm,’<div style="font-family:-apple-system,sans-serif;font-size:14px;font-weight:700;margin:10px 0 4px;color:var(--text)">$1</div>’);
t=t.replace(/^## (.*)/gm,’<div style="font-family:-apple-system,sans-serif;font-size:15px;font-weight:800;margin:12px 0 6px;color:var(--green)">$1</div>’);
t=t.replace(/\n/g,’<br>’);
return t;
}

window.addEventListener(‘load’, render);
